const devices=[
 {name:'图书馆',floor:'一楼大厅 · 服务台右侧',distance:120,time:2,x:365,y:143,open:true,hours:'07:00–23:00',code:'AED-001',scene:'由图书馆南门进入，在一层服务台右侧可见绿色 AED 壁柜。'},
 {name:'第一教学楼',floor:'一楼大厅 · 东侧入口',distance:280,time:4,x:176,y:137,open:true,hours:'06:30–22:30',code:'AED-002',scene:'由教学楼东门进入，沿走廊直行，AED 位于楼梯旁的绿色壁柜。'},
 {name:'体育馆',floor:'一楼大厅 · 值班室旁',distance:450,time:6,x:566,y:208,open:true,hours:'07:00–22:00',code:'AED-003',scene:'从体育馆西门进入，在值班室旁找到 AED 柜。'},
 {name:'学生服务中心',floor:'一楼 · 安保服务点',distance:610,time:8,x:210,y:285,open:true,hours:'全天 24 小时',code:'AED-004',scene:'进入学生服务中心北门，AED 位于安保服务点外侧。'},
 {name:'校医院',floor:'急诊入口 · 右侧墙面',distance:730,time:10,x:515,y:67,open:true,hours:'全天 24 小时',code:'AED-005',scene:'沿主路到达校医院，急诊入口右侧设有 AED 柜。'},
 {name:'第二食堂',floor:'一楼 · 正门入口',distance:860,time:12,x:88,y:240,open:false,hours:'设备维护中',code:'AED-006',scene:'该设备处于模拟维护状态，请选择其他可用 AED。'}
];
const courses=[{name:'心肺复苏与 AED 使用',desc:'从识别到施救，掌握关键急救步骤',duration:'12 分钟',icon:'heart',color:'',tag:'核心必修',article:0},{name:'校园常见急症识别',desc:'识别中暑、卒中与气道异物的危险信号',duration:'8 分钟',icon:'shield',color:'rose',tag:'场景学习',article:2},{name:'急救现场的第一响应',desc:'确保安全、有效呼救，成为可靠的帮手',duration:'6 分钟',icon:'phone',color:'blue',tag:'入门基础',article:5}];
const sessions=[{id:0,day:'20',month:'11 月',date:'2026-11-20',time:'14:00–16:00',title:'心肺复苏 & AED 实操训练',place:'校医院 · 二楼技能培训室',spots:8},{id:1,day:'22',month:'11 月',date:'2026-11-22',time:'09:00–11:00',title:'校园急救员基础实训',place:'学生服务中心 · 201 室',spots:12},{id:2,day:'25',month:'11 月',date:'2026-11-25',time:'18:30–20:00',title:'急救情景模拟工作坊',place:'体育馆 · 多功能训练室',spots:6}];
const articles=[
 {id:0,title:'突然倒地，第一步该做什么？',category:'心肺复苏',desc:'先判断安全与反应，识别心搏骤停的信号。',time:'2 分钟',icon:'heart',word:'CPR',color:'red',date:'11.16',sections:[['先确认现场安全','确认自己和伤者周围没有交通、电源等危险。轻拍双肩并呼喊，观察是否有反应与正常呼吸。'],['无反应且无正常呼吸，立即行动','只有喘息也不属于正常呼吸。立即呼叫 120、开启免提，并让旁人取 AED。对于成人突发倒地，未受过完整 CPR 培训者可按调度员指导持续胸外按压。'],['尽早使用 AED','将 AED 带到伤者身边，打开设备，跟随语音操作。持续救助，直到专业人员接替或出现明确生命迹象。']],source:'美国红十字会 · Hands-Only CPR',url:'https://www.redcross.org/get-help/how-to-prepare-for-emergencies/hands-only-cpr.html'},
 {id:1,title:'AED 怎么用？记住这三个动作',category:'AED 使用',desc:'打开、贴片、听指令，让设备引导你施救。',time:'1 分钟',icon:'bolt',word:'AED',color:'green',date:'11.15',sections:[['打开设备，听语音','AED 用于无反应、无正常呼吸的伤者。呼叫急救并开始 CPR，AED 到达后立即打开设备。'],['按图贴片','暴露并擦干胸部，按照电极片上的图示贴好电极。设备会分析是否需要电击。'],['远离伤者，遵循提示','分析心律和电击时，确保无人触碰伤者。需要按键电击时依照提示操作；随后按语音提示立即继续 CPR。']],source:'英国红十字会 · AED 急救',url:'https://www.redcross.org.uk/first-aid/learn-first-aid/unresponsive-and-not-breathing-when-an-aed-is-available'},
 {id:2,title:'高温运动后，警惕热射病',category:'常见急症',desc:'意识异常是危险信号，及时呼救并降温。',time:'2 分钟',icon:'shield',word:'COOL',color:'',date:'11.14',sections:[['识别危险信号','高温环境或运动后，如果出现身体发热、意识混乱或倒地，应警惕热射病，这是危急情况。'],['立即呼救并开始降温','拨打 120，将人转移到阴凉处，移除多余衣物，用凉水湿润皮肤并扇风，遵从调度员指导持续降温。'],['持续观察','不要给意识不清的人喂水。观察呼吸；若无反应且无正常呼吸，立即按调度员指导开始 CPR 并使用 AED。']],source:'英国红十字会 · Heatstroke',url:'https://www.redcross.org.uk/first-aid/learn-first-aid/heatstroke'},
 {id:3,title:'吃东西被噎住，先看能否咳嗽',category:'常见急症',desc:'区分有效咳嗽与严重梗阻，避免盲目伸手。',time:'2 分钟',icon:'info',word:'HELP',color:'blue',date:'11.13',sections:[['还能有效咳嗽','鼓励继续咳嗽，并密切观察。不要把手指盲目伸入嘴里寻找异物。'],['不能说话、呼吸或有效咳嗽','提示严重气道梗阻，立即让旁人拨打 120。成人可按规范实施最多 5 次背部拍击；无效时最多 5 次腹部冲击，交替进行并听从调度员指导。孕妇及无法环抱腹部者需采用胸部冲击，方法应通过实操培训学习。'],['失去反应时','安全放倒伤者，遵循调度员指导开始 CPR。解除梗阻后，接受过腹部或胸部冲击者仍应由医务人员评估。此方法不适用于婴儿。']],source:'英国红十字会 · Adult choking',url:'https://www.redcross.org.uk/first-aid/learn-first-aid/choking'},
 {id:4,title:'识别卒中，记住 FAST',category:'常见急症',desc:'面部、手臂、语言异常，争取每一分钟。',time:'1 分钟',icon:'clock',word:'FAST',color:'green',date:'11.12',sections:[['F · Face 面部','观察微笑时，面部是否一侧下垂。'],['A · Arms 手臂 / S · Speech 语言','请对方举起双臂，看是否有一侧无力；留意是否言语含糊、说话异常。'],['T · Time 立即呼救','任何一项异常都应立即拨打 120。记录首次出现症状的时间，安慰伤者并等待专业救助，即使症状缓解也不能忽视。']],source:'英国红十字会 · Stroke',url:'https://www.redcross.org.uk/first-aid/learn-first-aid/stroke'},
 {id:5,title:'拨打 120，这些信息要说清',category:'急救常识',desc:'准确地点、现场情况、联系方式，清晰传达。',time:'1 分钟',icon:'phone',word:'120',color:'red',date:'11.11',sections:[['先确保安全','不要在自己仍处于危险的情况下靠近伤者。发现危急情况立即联系急救服务。'],['说明地点与情况','说清学校、校区、楼宇、楼层与入口；说明伤者人数、有无反应、是否正常呼吸。提供回拨电话，并听从调度员询问。'],['配合接应','不要急于挂断电话，可打开免提。让旁人在校园入口引导救护车，让其他人在安全的情况下取 AED。']],source:'美国红十字会 · First Aid Steps',url:'https://www.redcross.org/take-a-class/first-aid/performing-first-aid/first-aid-steps'}
];

function mapSvg(){const visible=filteredDevices();return `<svg class="campus-map" viewBox="0 0 660 340" preserveAspectRatio="xMidYMid meet" aria-label="青禾大学示意地图，六处 AED 设备"><defs><pattern id="grass" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r=".6" fill="#cbd6c0"/></pattern></defs><rect width="660" height="340" fill="#edf1e5"/><rect width="660" height="340" fill="url(#grass)"/><g transform="translate(${330*(1-state.zoom)} ${170*(1-state.zoom)}) scale(${state.zoom})"><path d="M-10 196H680M280-10V350M-10 73H690M449-10V350M-10 305H680" stroke="#e1e5d4" stroke-width="28" fill="none"/><path d="M-10 196H680M280-10V350M-10 73H690M449-10V350M-10 305H680" stroke="#fffef5" stroke-width="22" fill="none"/><path d="M-10 196H680M280-10V350" stroke="#e9e6d6" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/><rect x="30" y="20" width="183" height="28" rx="5" fill="#e0e5d5"/><rect x="27" y="94" width="65" height="70" rx="5" fill="#dce4d2" stroke="#d4ddc8"/><path d="M123 101h108v65h-32v-40h-44v40h-32Z" fill="#d9dfcd" stroke="#cdd6c0"/><text x="142" y="153">第一教学楼</text><rect x="313" y="98" width="103" height="74" rx="5" fill="#e6dfcb" stroke="#d9d1ba"/><rect x="322" y="106" width="86" height="11" rx="2" fill="#f6efde"/><text x="347" y="130">图书馆</text><path d="M485 101h122a16 16 0 0 1 16 16v51H485Z" fill="#dce5cd"/><rect x="510" y="110" width="90" height="48" rx="22" fill="#cbd8b9" stroke="#fff7" stroke-width="2"/><rect x="521" y="116" width="68" height="36" rx="16" fill="none" stroke="#fff8"/><path d="M555 116v36" stroke="#fff8"/><text x="535" y="178">运动场</text><rect x="482" y="224" width="122" height="56" rx="4" fill="#d5dece" stroke="#cbd5c2"/><path d="M494 224v56m15-56v56m15-56v56m15-56v56m15-56v56m15-56v56m15-56v56" stroke="#e7eddf" stroke-width="4"/><text x="528" y="260">体育馆</text><rect x="480" y="16" width="97" height="34" rx="4" fill="#e5ded0"/><text x="505" y="38">校医院</text><rect x="164" y="231" width="83" height="47" rx="4" fill="#dfe2ce" stroke="#d1d8c1"/><text x="174" y="251">学生服务</text><text x="184" y="266">中心</text><rect x="36" y="222" width="84" height="57" rx="4" fill="#e5dfcc"/><text x="51" y="269">第二食堂</text><path d="M323 235q15-30 47-13t27 53q-28 27-60 2t-14-42" fill="#cfe1d8"/><text x="338" y="254">知行湖</text><path d="M313 230q-13 38 13 58M394 223q24 23 6 60" stroke="#d1dbbf" stroke-width="10" fill="none"/><text x="140" y="200" class="road-name">学 苑 路</text><text x="474" y="200" class="road-name">梧 桐 大 道</text><text x="294" y="285" class="road-name" transform="rotate(-90 294 285)">知 行 路</text><text x="10" y="329" font-size="9">青禾大学 · 主校区示意</text>${[[20,110],[20,146],[104,94],[244,107],[244,150],[314,37],[336,37],[370,37],[398,37],[625,244],[626,271],[131,235],[133,265],[470,325],[490,325],[511,325],[534,325],[558,325],[580,325],[603,325],[631,32],[631,55]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="#d3dfc4"/><circle cx="${x-2}" cy="${y-2}" r="4" fill="#dce6cf"/>`).join('')}${state.route?`<path class="route-path" d="M280 237V196H${devices[state.selected].x}V${devices[state.selected].y}"/>`:''}<circle cx="280" cy="237" r="19" fill="#74a6dd22" class="pulse-ring"/><circle cx="280" cy="237" r="7" fill="#6f9fd2" stroke="#fff" stroke-width="3"/>${visible.map(d=>{const id=devices.indexOf(d);return `<g class="map-pin ${id===state.selected?'selected':''} ${d.open?'':'unavailable'}" role="button" tabindex="0" data-device="${id}" aria-label="${d.name} AED，${d.open?'可用':'维护中'}"><path d="m${d.x-5} ${d.y+13} 5 8 5-8" fill="${id===state.selected?'#dc4846':d.open?'#519783':'#b3b9af'}"/><circle class="pin-disc" cx="${d.x}" cy="${d.y}" r="16"/><text x="${d.x}" y="${d.y+3}" text-anchor="middle">AED</text></g>`}).join('')}</g></svg>`}
function filteredDevices(){return devices.filter(d=>(state.filter!=='available'||d.open)&&(state.filter!=='24h'||d.hours.includes('24'))&&(`${d.name}${d.floor}${d.code}`).toLowerCase().includes(state.query.toLowerCase()))}
function mapPanel(){return `<div class="map-card"><div class="map-top"><label class="map-search">${icon('search')}<input id="aed-search" aria-label="搜索建筑或 AED 编号" placeholder="搜索建筑 / AED 编号" value="${esc(state.query)}"></label><span class="map-demo">示意地图 · 演示位置</span></div><div id="map-svg">${mapSvg()}</div><span class="map-location"><span class="blue-dot"></span>当前位置：知行路（模拟）</span><div class="map-controls"><button data-action="zoom-out" aria-label="缩小地图">−</button><button data-action="zoom-in" aria-label="放大地图">＋</button><button data-action="recenter" aria-label="返回模拟位置">${icon('locate')}</button></div></div>`}
function aedItem(d){const i=devices.indexOf(d);return `<button class="aed-item ${state.selected===i?'active':''}" data-device="${i}"><span class="aed-mini">${icon('bolt')}</span><span class="aed-info"><strong>${d.name} AED</strong><small><span class="status-text ${d.open?'':'off'}">${d.open?'● 可用':'● 维护中'}</span> · ${d.floor.split(' · ')[0]}</small></span><span class="aed-distance">${d.distance} m<small>约 ${d.time} 分钟</small></span></button>`}
function nearby(full=false){const list=filteredDevices();return `<div class="nearby-card"><div class="nearby-top"><strong>${full?'校内 AED 设备':'附近的 AED'}</strong><small>${full?list.length+' 台 · 演示状态':'距离由近到远'}</small></div><div id="device-list">${(full?list:list.slice(0,3)).map(aedItem).join('')||'<div class="no-results">没有匹配的设备，请试试其他关键词。</div>'}</div><button class="primary navigate" data-action="navigate" ${list.length&&devices[state.selected].open?'':'disabled'}>${icon('pin')} 导航至${devices[state.selected].name} ${icon('arrow')}</button></div>`}
function heading(title,ic,sub,action,label){return `<div class="section-heading"><h2>${icon(ic)}${title}${sub?`<span class="sub">${sub}</span>`:''}</h2>${action?`<button class="text-button" ${action}>${label}${icon('arrow')}</button>`:''}</div>`}

function aedPage(){const d=devices[state.selected];return `<section class="aed-page"><div class="intro-actions"><div class="page-intro"><h1>AED 实景导航</h1><p>找到设备，也找到通往生命的方向。</p></div><button class="primary" data-action="scan">${icon('scan')}扫码看 15 秒教程</button></div><div class="toolbar">${[['all','全部设备 · 6'],['available','仅看可用 · 5'],['24h','24 小时开放 · 2']].map(([id,t])=>`<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${t}</button>`).join('')}<span class="tag">${icon('info')}设备状态为演示数据</span></div><div class="map-grid">${mapPanel()}${nearby(true)}</div><div class="detail-panel"><div><h3>${d.name} · ${d.code} <span class="tag">${d.open?'可用':'维护中'}</span></h3><p>${d.floor} ｜ 开放时间 ${d.hours}</p><p style="margin-top:7px">${d.scene}</p></div><div class="buttons"><button class="secondary" data-action="scene">查看到达指引</button><button class="primary" data-action="tutorial">${icon('play')}15 秒快学</button></div></div><div class="notice">地图、距离和开放状态均为原型示例，未接入校园实时数据。实际使用请以现场设备状态与开放情况为准。</div></section>`}
function trainingPage(){return `<div class="page-intro"><h1>学会急救，多一份守护</h1><p>从理论到实践，让每一次善意都有专业的支撑。</p></div><div class="section-tabs">${[['learn','线上理论学习'],['book','线下实操预约'],['cert','电子证书查询']].map(([id,t])=>`<button class="${state.trainingTab===id?'active':''}" data-training="${id}">${t}</button>`).join('')}</div>${state.trainingTab==='learn'?`<div class="cards-grid">${courses.map((c,i)=>`<article class="learning-card"><div class="learning-art ${c.color}">${icon(c.icon)}</div><div class="card-body"><span class="mini-tag">${c.tag}</span><h3>${c.name}</h3><p>${c.desc}</p><div class="progress-bar"><span style="width:${state.lessons.includes(i)?100:0}%"></span></div><div class="progress-meta"><span>${state.lessons.includes(i)?'已完成知识测验':'尚未学习'}</span><span>${c.duration}</span></div><button class="${state.lessons.includes(i)?'secondary':'primary'}" data-lesson="${i}">${icon(state.lessons.includes(i)?'check':'play')}${state.lessons.includes(i)?'复习课程':'开始学习'}</button></div></article>`).join('')}</div><div class="notice green">线上学习用于认识关键步骤。掌握急救技能还需要线下实操训练与专业考核。</div>`:state.trainingTab==='book'?`<div class="notice green">以下场次用于预约流程演示，预约仅保存在当前浏览器，不会提交给学校。</div>${sessions.map(s=>`<div class="appointment"><div class="date-block"><small>${s.month}</small><strong>${s.day}</strong></div><div class="appointment-copy"><h3>${s.title}</h3><p>${s.date} ${s.time} <span class="tag">剩余 ${s.spots-(state.bookings.includes(s.id)?1:0)} 个名额 · 模拟</span></p><p style="margin-top:6px">${s.place} · 小班教学</p></div><button class="${state.bookings.includes(s.id)?'secondary':'primary'}" data-book="${s.id}">${state.bookings.includes(s.id)?'已预约 · 查看':'立即预约'}</button></div>`).join('')}`:`<div class="certificate-search">${icon('award')}<h2>每一份学习，都值得被记录</h2><p class="profile-text">输入演示编号，查看电子急救证书样本。</p><label class="field-label" for="certificate-id">证书编号 / 学号</label><form id="certificate-form" class="form-row"><input id="certificate-id" required placeholder="演示编号：QH2026001" autocomplete="off"><button class= function articleCard(a){return `<article class="article-card"><div class="article-art ${a.color}"><span class="art-word">${a.word}</span>${icon(a.icon)}</div><div class="card-body"><div class="article-meta"><span>${a.category} · ${a.time}</span><span>${a.date} 更新</span></div><h3>${a.title}</h3><p>${a.desc}</p><div class="article-bottom"><button data-article="${a.id}">阅读知识卡片 →</button><button class="icon-button save-button ${state.favorites.includes(a.id)?'saved':''}" data-save="${a.id}" aria-label="${state.favorites.includes(a.id)?'取消收藏':'收藏'}${a.title}" aria-pressed="${state.favorites.includes(a.id)}">${icon('save')}</button></div></div></article>`}
function knowledgeCards(){const list=articles.filter(a=>(state.knowledgeFilter==='全部'||state.knowledgeFilter==='我的收藏'&&state.favorites.includes(a.id)||a.category===state.knowledgeFilter)&&(a.title+a.desc+a.category).includes(state.knowledgeQuery));return list.map(articleCard).join('')||'<div class="empty-state">没有找到相关知识卡片，试试其他关键词。</div>'}

function profilePage(){return `<div class="page-intro"><h1>我的急救成长记录</h1><p>学习一点，准备多一点。</p></div><div class="profile-head"><span class="avatar">林</span><div><h2>林同学 <span class="tag">演示账户</span></h2><p>青禾大学 · 主校区 ｜ 已完成 ${state.lessons.length} / 3 门课程</p></div></div><div class="profile-grid"><section class="white-panel"><h3>${icon('calendar')} 我的实操预约</h3>${state.bookings.length?state.bookings.map(id=>{const s=sessions[id];return s?`<div class="small-row"><div>${s.title}<small>${s.date} ${s.time}<br>${s.place} · 模拟预约</small></div><button data-book="${id}">查看</button></div>`:''}).join(''):`<div class="empty-state">${icon('calendar')}还没有预约，选择一场实操课吧。</div><button class="secondary" data-training="book">查看培训场次</button>`}</section><section class="white-panel"><h3>${icon('save')} 我的知识收藏</h3>${state.favorites.length?state.favorites.map(id=>articles[id]?`<div class="small-row"><div>${articles[id].title}<small>${articles[id].category} · ${articles[id].time}</small></div><button data-article="${id}">阅读</button></div>`:'').join(''):`<div class="empty-state">${icon('book')}收藏常用知识，需要时快速找到。</div><button class="secondary" data-page="knowledge">浏览急救科普</button>`}</section></div><div class="detail-panel"><div><h3>校园急救志愿者</h3><p>${state.joined?'你已登记志愿服务意向（仅本地演示）。':'把一份关心，变成可以行动的力量。'}</p></div><button class="primary" data-action="join">${state.joined?'查看意向登记':'了解志愿服务'}</button></div><p class="profile-text">学习、预约与收藏仅保存在当前浏览器。清除浏览器数据后将重置。</p>`}
function render(){const names={home:'首页',aed:'AED 实景导航',training:'培训服务',knowledge:'急救科普',profile:'我的'};$('#page-name').textContent=names[state.page];$('#main').innerHTML=({home,aed:aedPage,training:trainingPage,knowledge:knowledgePage,profile:profilePage}[state.page]||home)();$$('[data-page]').forEach(b=>{const on=b.dataset.page===state.page;b.classList.toggle('active',on);if(b.closest('nav')){on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')}})}
function go(page){if(!['home','aed','training','knowledge','profile'].includes(page))page='home';state.page=page;state.query='';state.filter='all';state.route=false;render();window.scrollTo({top:0,behavior:'instant'});if(location.hash!=='#'+page)history.replaceState(null,'','#'+page)}
let modalCleanup=()=>{},toastTimer,modalTrigger;
function showModal(html,label='校园急救通'){modalCleanup();modalCleanup=()=>{};$('#modal-eyebrow').textContent=label;$('#modal-content').innerHTML=html;if(!$('#modal').open){modalTrigger=document.activeElement;$('#modal').showModal()}$('#modal').scrollTop=0}
function closeModal(){modalCleanup();modalCleanup=()=>{};$('#modal').close();if(modalTrigger?.isConnected)modalTrigger.focus()}
$('#modal').addEventListener('cancel',()=>{modalCleanup();modalCleanup=()=>{}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});

function selectDevice(id){state.selected=id;state.route=false;const input=$('#aed-search');const pos=input?.selectionStart;render();if(input&&document.activeElement===input){$('#aed-search')?.focus();$('#aed-search')?.setSelectionRange(pos,pos)}}
function navigate(){const d=devices[state.selected];if(!d.open)return toast('这台设备正在维护，请选择可用设备');state.route=true;render();showModal(`<h2 id="modal-title">前往${d.name} AED</h2><div class="notice">路线为示意演示，无法用于真实导航。</div><div class="route-summary"><div><strong>${d.distance}</strong> <small>米 · 示例距离</small></div><div><strong>${d.time}</strong> <small>分钟 · 预计步行</small></div></div><ol class="route-list"><li>从模拟位置「知行路」出发</li><li>沿学苑路前往${d.name}入口</li><li>${d.floor}</li></ol><p class="modal-desc">${d.scene}</p><button class="primary full" data-action="close">查看地图路线 ${icon('arrow')}</button>`,'AED 导航 · 模拟路线')}
function scene(){const d=devices[state.selected];showModal(`<h2 id="modal-title">${d.name} · 到达指引</h2><div class="tutorial-stage">${icon('pin')}<span class="tutorial-count">实景点位示意</span></div><div class="modal-location">${icon('bolt')}<div>${d.floor}<small>${d.code} · ${d.hours}</small></div></div><p class="modal-desc">${d.scene}</p><div class="notice">当前为文字点位示意，正式实景导航需补充真实设备照片与校内坐标。</div><button class="primary full" data-action="navigate">开始路线演示</button>`)}
function source(a){return `<p class="source">参考：<a href="${a.url}" target="_blank" rel="noopener noreferrer">${a.source} ↗</a><br>通用知识仅供学习；在中国大陆遇到紧急情况，请拨打 120 并听从调度员指导。</p>`}
function article(id){const a=articles[id];showModal(`<h2 id="modal-title">${a.title}</h2><p class="modal-desc">${a.category} · ${a.time}阅读 · 示例更新 2026.${a.date}</p><div class="reading-body"><div class="article-art ${a.color}"><span class="art-word">${a.word}</span>${icon(a.icon)}</div>${a.sections.map(([h,p])=>`<h3>${h}</h3><p>${p}</p>`).join('')}</div>${source(a)}<div class="bookmark-bar"><span class="profile-text">把知识存好，把准备做好。</span><button class="secondary" data-modal-save="${id}">${icon('save')}${state.favorites.includes(id)?'已收藏 · 取消':'收藏知识'}</button></div>`,'急救科普 · 知识卡片')}
function toggleSave(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();render();toast(state.favorites.includes(id)?'已加入我的收藏':'已取消收藏')}
function lesson(id){const c=courses[id];const a=articles[c.article];showModal(`<h2 id="modal-title">${c.name}</h2><p class="modal-desc">微课程 · ${c.duration} · 阅读后完成一道知识测验</p><div class="step-list">${a.sections.map(([h,p],i)=>`<div class="step"><span class="step-number">${i+1}</span><div><h4>${h}</h4><p>${p}</p></div></div>`).join('')}</div>${id===0?'<button class="secondary full" data-action="tutorial">播放 AED 15 秒快速教程</button>':''}${source(a)}<button class="primary full" data-quiz="${id}">我已阅读，进入知识测验 ${icon('arrow')}</button>`,'培训服务 · 线上学习')}
function quiz(id){const q=[{q:'成人无反应、无正常呼吸时，应如何行动？',a:['等待对方自行苏醒','呼叫 120，开始 CPR 并尽早使用 AED','先扶起并喂水'],correct:1},{q:'高温运动后出现意识混乱，应如何处理？',a:['立即呼叫 120 并开始降温','继续运动，让身体适应','给意识不清的人喂水'],correct:0},{q:'向急救调度员说明地点时，哪一项最清楚？',a:['学校里，有人不舒服','快来就可以了','学校、校区、楼宇、楼层和入口'],correct:2}][id];showModal(`<h2 id="modal-title">把关键一步，记在心里</h2><p class="modal-desc">${courses[id].name} · 课后测验</p><h3 style="font-size:15px">${q.q}</h3>${q.a.map((t,i)=>`<button class="quiz-option" data-answer="${i}" data-correct="${q.correct}" data-course="${id}">${String.fromCharCode(65+i)}. ${t}</button>`).join('')}<div id="quiz-feedback" role="status"></div>`,'线上学习 · 知识测验')}
function book(id){const s=sessions[id];const booked=state.bookings.includes(id);showModal(`<h2 id="modal-title">${booked?'我的实操预约':'预约线下实操'}</h2><p class="modal-desc">${s.title}</p><div class="modal-location">${icon('calendar')}<div>${s.date} ${s.time}<small>${s.place}</small></div></div><div class="notice green">${booked?'模拟预约已保存。本记录仅存于当前浏览器。':'演示账户：林同学 · 无需填写真实个人信息。'}</div><div class="step-list"><div class="step"><span class="step-number">1</span><div><h4>提前了解基础知识</h4><p>建议完成「心肺复苏与 AED 使用」线上课程。</p></div></div><div class="step"><span class="step-number">2</span><div><h4>穿着便于活动的衣物</h4><p>课程包含模拟人练习与设备操作。</p></div></div></div>${booked?`<button class="secondary full" data-cancel-book="${id}">取消模拟预约</button>`:`<button class="primary full" data-confirm-book="${id}">确认模拟预约</button>`}<p class="source">原型场次不实际开课，不会提交预约到学校。</p>`,'培训服务 · 实操预约')}

function tutorial(){let elapsed=0,playing=true,last=performance.now();const steps=[['bolt','01 · 开机，听语音','确认伤者无反应、无正常呼吸。呼叫 120 并开始 CPR，AED 到达后打开设备。'],['heart','02 · 按图贴好电极片','暴露并擦干胸部，按照电极片图示粘贴。'],['shield','03 · 听指令，远离伤者','分析和电击时勿触碰伤者；按语音提示电击，随后立即继续 CPR。']];showModal(`<h2 id="modal-title">AED 15 秒快速操作</h2><p class="modal-desc">三个关键动作，跟随设备语音提示。仅供快速复习。</p><div class="tutorial-stage"><span id="tutorial-icon">${icon('bolt')}</span><span class="tutorial-count" id="tutorial-count">01 / 03</span></div><div class="tutorial-title"><h3 id="tutorial-heading"></h3><p id="tutorial-desc"></p></div><div class="tutorial-controls"><button class="secondary" id="tutorial-toggle">暂停</button><div class="progress-bar"><span id="tutorial-progress" style="width:0%"></span></div><small id="tutorial-time">0 / 15 秒</small></div>${source(articles[1])}`,'AED 操作 · 动画教程');const paint=()=>{const step=steps[Math.min(2,Math.floor(elapsed/5))];$('#tutorial-icon').innerHTML=icon(step[0]);$('#tutorial-icon svg').style.cssText='width:85px;height:85px;stroke-width:1.2;color:#70937b';$('#tutorial-heading').textContent=step[1];$('#tutorial-desc').textContent=step[2];$('#tutorial-count').textContent=`0${Math.min(3,Math.floor(elapsed/5)+1)} / 03`;$('#tutorial-progress').style.width=(elapsed/15*100)+'%';$('#tutorial-time').textContent=`${Math.floor(elapsed)} / 15 秒`;$('#tutorial-toggle').textContent=elapsed>=15?'重播':playing?'暂停':'继续'};paint();const timer=setInterval(()=>{const now=performance.now();if(playing){elapsed=Math.min(15,elapsed+(now-last)/1000);if(elapsed>=15)playing=false;paint()}last=now},100);$('#tutorial-toggle').onclick=()=>{if(elapsed>=15){elapsed=0;playing=true}else playing=!playing;last=performance.now();paint()};modalCleanup=()=>clearInterval(timer)}
let cameraStream=null;
function scan(){showModal(`<h2 id="modal-title">扫描 AED，快速学会使用</h2><p class="modal-desc">扫描设备标签二维码，或输入设备编号查看 15 秒教程。</p><div class="scan-box" id="scan-box">${icon('scan')}<p id="scan-message">设备标签示例：AED-001</p></div><button class="secondary full" id="camera-button">${icon('scan')}启用摄像头扫码</button><form id="scan-form"><label class="field-label" for="device-code">设备编号</label><div class="form-row"><input id="device-code" placeholder="如 AED-001" required aria-label="设备编号"><button type="submit" class="primary">查看教程</button></div><p id="scan-error" role="status" class="profile-text"></p></form><button class="secondary full" data-action="tutorial">使用演示设备，体验教程</button>`,'AED 导航 · 扫码快学');let active=true,timer;modalCleanup=()=>{active=false;clearTimeout(timer);cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null};$('#camera-button').onclick=async()=>{if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){$('#scan-message').textContent='此浏览器不支持自动识码，请输入设备编号或使用演示设备。';return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});if(!active){cameraStream.getTracks().forEach(t=>t.stop());return}$('#scan-box').innerHTML='<video id="camera-video" playsinline muted></video><p>将设备二维码放入画面</p>';const video=$('#camera-video');video.srcObject=cameraStream;await video.play();const detector=new BarcodeDetector({formats:['qr_code']});const detect=async()=>{if(!active)return;try{const codes=await detector.detect(video);if(!active)return;const match=codes.map(c=>c.rawValue.match(/AED-00[1-6]/i)?.[0]).find(Boolean);if(match){state.selected=devices.findIndex(d=>d.code===match.toUpperCase());render();tutorial();return}}catch{}timer=setTimeout(detect,350)};detect()}catch{if(active)$('#scan-box').innerHTML='<p>摄像头未能开启。请允许相机访问，或使用下方设备编号。</p>';cameraStream?.getTracks().forEach(t=>t.stop())}}}
function sos(){showModal(`<h2 id="modal-title">紧急时刻，立即行动</h2><p class="modal-desc">此为呼救流程演示，不会通知急救员或呼叫急救中心。</p><div class="modal-location">${icon('locate')}<div>青禾大学 · 知行路<small>当前为模拟位置，可在发起后尝试获取真实坐标</small></div></div><button class="primary full" data-action="start-sos">${icon('phone')}一键发起模拟呼救</button><a class="phone-link" href="tel:120">${icon('phone')}真实紧急情况：拨打 120</a><div class="step-list"><div class="step"><span class="step-number">1</span><div><h4>先确保现场安全</h4><p>判断伤者反应与呼吸，准备说清具体位置。</p></div></div><div class="step"><span class="step-number">2</span><div><h4>不要依赖本原型获得救援</h4><p>真实紧急情况请直接联系 120，并遵循调度员指导。</p></div></div></div>`,'一键呼救 · 演示模式')}
function startSos(){showModal(`<h2 id="modal-title">模拟呼救已发起</h2><div class="sos-state">${icon('phone')}<div><h3>正在演示通知附近急救员</h3><p id="sos-status">模拟发送中 · 实际未发送任何通知</p></div></div><div class="modal-location">${icon('locate')}<div id="sos-location">青禾大学 · 知行路（模拟）<small>定位等待授权，坐标仅在本页显示</small></div></div><div id="responders" aria-live="polite"></div><h3 style="font-size:15px;margin-top:23px">现场操作指引 · 成人突发倒地</h3><div class="step-list">${[['确认安全、判断反应与呼吸','轻拍呼喊，观察是否有正常呼吸。'],['无反应且无正常呼吸：呼叫 120','开启免提，按调度员指导开始 CPR，并让旁人取 AED。只有喘息也属于呼吸异常。'],['AED 到达后遵从语音','分析或电击时，确保无人触碰伤者，随后按提示继续 CPR。']].map(([h,p],i)=>`<div class="step"><span class="step-number">${i+1}</span><div><h4>${h}</h4><p>${p}</p></div></div>`).join('')}</div><a class="phone-link" href="tel:120">${icon('phone')}拨打真实急救电话 120</a><button class="secondary full" data-action="close">结束模拟呼救</button>${source(articles[0])}`,'一键呼救 · 无真实通知');let active=true;const timer=setTimeout(()=>{if(!active)return;$('#sos-status').textContent='模拟已通知 3 名附近急救员 · 实际未发送';$('#responders').innerHTML=[['周','周同学','模拟已响应 · 约 2 分钟'],['陈','陈老师','模拟已响应 · 约 4 分钟'],['李','李同学','模拟通知待查看']].map(([a,n,t])=>`<div class="responder-row"><span class="avatar">${a}</span><span>${n}</span><small>${t}</small></div>`).join('')},1600);modalCleanup=()=>{active=false;clearTimeout(timer)};if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{if(active)$('#sos-location').innerHTML=`已获取真实坐标（仅本页）<small>${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} · 精度约 ${Math.round(pos.coords.accuracy)} 米<br>未发送；模拟救援点仍为知行路</small>`},()=>{if(active)$('#sos-location').innerHTML='青禾大学 · 知行路（模拟）<small>未取得定位权限或定位超时，使用模拟位置继续演示</small>'},{enableHighAccuracy:true,timeout:7000,maximumAge:60000})}else $('#sos-location').innerHTML='青禾大学 · 知行路（模拟）<small>当前浏览器不支持定位</small>'}
function join(){showModal(`<h2 id="modal-title">成为校园里的守护者</h2><p class="modal-desc">学习急救知识，参加规范培训，在需要时伸出援手。</p><ul class="join-list"><li>完成线上理论课程，建立急救意识</li><li>参加线下实操与考核，练习关键技能</li><li>通过学校审核后，加入校园急救志愿队</li></ul><div class="notice green">${state.joined?'你已登记意向（仅本地演示）。正式参与请联系学校相关部门。':'意向登记仅用于原型演示，不会向学校发送资料。'}</div><button class="primary full" data-action="join-confirm">${state.joined?'已登记 · 前往学习':'登记模拟意向'}</button>`,'志愿服务 · 一起守护')}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-device]');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.device!==undefined){selectDevice(Number(b.dataset.device));return}if(b.dataset.filter){state.filter=b.dataset.filter;const ds=filteredDevices();if(ds.length&&!ds.includes(devices[state.selected]))state.selected=devices.indexOf(ds[0]);state.route=false;render();return}if(b.dataset.training){state.trainingTab=b.dataset.training;go('training');return}if(b.dataset.category){state.knowledgeFilter=b.dataset.category;render();return}if(b.dataset.article!==undefined){article(+b.dataset.article);return}if(b.dataset.save!==undefined){toggleSave(+b.dataset.save);return}if(b.dataset.modalSave!==undefined){const id=+b.dataset.modalSave;toggleSave(id);b.innerHTML=icon('save')+(state.favorites.includes(id)?'已收藏 · 取消':'收藏知识');return}if(b.dataset.lesson!==undefined){lesson(+b.dataset.lesson);return}if(b.dataset.quiz!==undefined){quiz(+b.dataset.quiz);return}if(b.dataset.answer!==undefined){const right=b.dataset.answer===b.dataset.correct;b.classList.add(right?'correct':'wrong');if(right){const id=+b.dataset.course;if(!state.lessons.includes(id))state.lessons.push(id);persist();$$('.quiz-option').forEach(x=>x.disabled=true);$('#quiz-feedback').innerHTML='<div class="notice green">回答正确！课程已完成。继续参加实操，让知识变成技能。</div><button class="primary full" data-action="finish-lesson">完成学习</button>';render()}else $('#quiz-feedback').innerHTML='<div class="notice red">再想一想，及时识别、正确呼救十分重要。请选择其他答案。</div>';return}if(b.dataset.book!==undefined){book(+b.dataset.book);return}if(b.dataset.confirmBook!==undefined){const id=+b.dataset.confirmBook;if(!state.bookings.includes(id))state.bookings.push(id);persist();render();book(id);toast('模拟预约成功，已保存到「我的」');return}if(b.dataset.cancelBook!==undefined){state.bookings=state.bookings.filter(x=>x!==+b.dataset.cancelBook);persist();render();closeModal();toast('模拟预约已取消');return}const actions={sos,startSos, 'start-sos':startSos,scan,tutorial,navigate,scene,join,close:closeModal,'finish-lesson':()=>{closeModal();state.trainingTab='learn';go('training')},'zoom-in':()=>{state.zoom=Math.min(1.6,state.zoom+.2);$('#map-svg').innerHTML=mapSvg()},'zoom-out':()=>{state.zoom=Math.max(1,state.zoom-.2);$('#map-svg').innerHTML=mapSvg()},recenter:()=>{state.zoom=1;$('#map-svg').innerHTML=mapSvg();toast('已回到模拟位置：知行路')},campus:()=>showModal('<h2 id="modal-title">当前校区</h2><div class="modal-location">'+icon('pin')+'<div>青禾大学 · 主校区<small>用于产品原型的虚构校园</small></div></div><p class="modal-desc">此版本展示单校区体验。接入真实数据后，可扩展多校区设备地图与实景照片。</p>'),notifications:()=>showModal('<h2 id="modal-title">校园急救动态</h2><div class="small-row"><div>本月急救实操场次已更新<small>示例通知 · 11 月 16 日</small></div></div><div class="small-row"><div>第二食堂 AED 设备维护中<small>模拟状态 · 请选择其他可用设备</small></div></div><button class="primary full" data-action="view-sessions">查看培训场次</button>'),'view-sessions':()=>{closeModal();state.trainingTab='book';go('training')},'join-confirm':()=>{if(state.joined){closeModal();go('training')}else{state.joined=true;persist();render();join();toast('已保存模拟志愿意向')}}};actions[b.dataset.action]?.()});
document.addEventListener('keydown',e=>{const b=e.target.closest('[data-device]');if(b&&b.tagName.toLowerCase()==='g'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectDevice(+b.dataset.device)}});
document.addEventListener('input',e=>{if(e.target.id==='aed-search'){state.query=e.target.value;state.route=false;const list=filteredDevices();if(list.length&&!list.includes(devices[state.selected]))state.selected=devices.indexOf(list[0]);$('#map-svg').innerHTML=mapSvg();$('.nearby-card').outerHTML=nearby(state.page==='aed');if(state.page==='aed'){const temp=document.createElement('div');temp.innerHTML=aedPage();$('.detail-panel').outerHTML=$('.detail-panel',temp).outerHTML}}if(e.target.id==='knowledge-search'){state.knowledgeQuery=e.target.value;$('#knowledge-cards').innerHTML=knowledgeCards()}});
document.addEventListener('submit',e=>{if(e.target.id==='certificate-form'){e.preventDefault();certificate()}if(e.target.id==='scan-form'){e.preventDefault();const code=$('#device-code').value.trim().toUpperCase();const i=devices.findIndex(d=>d.code===code);if(i<0){$('#scan-error').textContent='未找到该设备，请输入 AED-001 至 AED-006。';return}state.selected=i;render();tutorial()}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'home');
</script>
